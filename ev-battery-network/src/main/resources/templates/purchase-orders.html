<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Purchase Orders | EV Battery Network</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7f5;
            color: #17251c;
        }

        .header {
            background: #ffffff;
            border-bottom: 1px solid #dce5df;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header h1 {
            font-size: 25px;
            margin-bottom: 5px;
        }

        .header p {
            color: #68756d;
            font-size: 14px;
        }

        .back-btn {
            background: #198754;
            color: white;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e0e8e3;
            border-radius: 14px;
            padding: 22px;
        }

        .stat-title {
            color: #68756d;
            font-size: 13px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 8px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 22px;
            align-items: start;
        }

        .card {
            background: white;
            border: 1px solid #e0e8e3;
            border-radius: 14px;
            padding: 24px;
        }

        .card h2 {
            font-size: 19px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #4f5d55;
        }

        input,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ccd7d0;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #198754;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            border: none;
            padding: 11px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary {
            background: #198754;
            color: white;
        }

        .btn-secondary {
            background: #e9efeb;
            color: #34443a;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: #f0f5f2;
            padding: 13px;
            text-align: left;
            font-size: 13px;
            color: #526057;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #edf1ee;
            font-size: 14px;
        }

        tr:hover {
            background: #fafcfb;
        }

        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .approved {
            background: #cfe2ff;
            color: #084298;
        }

        .received {
            background: #d1e7dd;
            color: #0f5132;
        }

        .cancelled {
            background: #f8d7da;
            color: #842029;
        }

        .action-btn {
            border: none;
            padding: 6px 9px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 4px;
            font-size: 12px;
        }

        .edit {
            background: #cfe2ff;
            color: #084298;
        }

        .delete {
            background: #f8d7da;
            color: #842029;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #68756d;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;
        }

        .error {
            background: #f8d7da;
            color: #842029;
        }

        @media (max-width: 1100px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {
            .header {
                padding: 15px;
            }

            .container {
                padding: 18px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div>
        <h1>📦 Purchase Orders</h1>
        <p>Manage battery and equipment procurement</p>
    </div>

    <a href="/" class="back-btn">← Dashboard</a>

</header>


<main class="container">

    <!-- STATISTICS -->

    <div class="stats">

        <div class="stat-card">
            <div class="stat-title">Total Orders</div>
            <div class="stat-value" id="totalOrders">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">Pending</div>
            <div class="stat-value" id="pendingOrders">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">Received</div>
            <div class="stat-value" id="receivedOrders">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">Total Purchase Value</div>
            <div class="stat-value" id="totalValue">₹0</div>
        </div>

    </div>


    <div id="message" class="message"></div>


    <div class="main-grid">

        <!-- FORM -->

        <div class="card">

            <h2 id="formTitle">➕ Create Purchase Order</h2>

            <form id="purchaseOrderForm">

                <input type="hidden" id="editId">

                <div class="form-group">
                    <label>PO Number</label>
                    <input
                            type="text"
                            id="poNumber"
                            placeholder="PO-001"
                            required>
                </div>

                <div class="form-group">
                    <label>Vendor Name</label>
                    <input
                            type="text"
                            id="vendorName"
                            placeholder="Battery Manufacturer"
                            required>
                </div>

                <div class="form-group">
                    <label>Product / Service</label>
                    <input
                            type="text"
                            id="productName"
                            placeholder="EV Battery Module"
                            required>
                </div>

                <div class="form-group">
                    <label>Quantity</label>
                    <input
                            type="number"
                            id="quantity"
                            min="1"
                            placeholder="10"
                            required>
                </div>

                <div class="form-group">
                    <label>Unit Price (₹)</label>
                    <input
                            type="number"
                            id="unitPrice"
                            min="0"
                            step="0.01"
                            placeholder="5000"
                            required>
                </div>

                <div class="form-group">
                    <label>Status</label>

                    <select id="status">

                        <option value="PENDING">PENDING</option>
                        <option value="APPROVED">APPROVED</option>
                        <option value="RECEIVED">RECEIVED</option>
                        <option value="CANCELLED">CANCELLED</option>

                    </select>
                </div>


                <div class="form-buttons">

                    <button
                            type="submit"
                            class="btn btn-primary"
                            id="saveBtn">
                        Create Order
                    </button>

                    <button
                            type="button"
                            class="btn btn-secondary"
                            onclick="resetForm()">
                        Clear
                    </button>

                </div>

            </form>

        </div>


        <!-- TABLE -->

        <div class="card">

            <h2>📋 Purchase Order List</h2>

            <div class="table-wrapper">

                <table>

                    <thead>

                    <tr>
                        <th>ID</th>
                        <th>PO Number</th>
                        <th>Vendor</th>
                        <th>Product</th>
                        <th>Qty</th>
                        <th>Unit Price</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>

                    </thead>

                    <tbody id="orderTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>


<script>

    const API = "/api/purchase-orders";

    const username = "admin";
    const password = "admin123";

    const authHeader =
        "Basic " + btoa(username + ":" + password);


    let orders = [];


    function currency(value) {

        return "₹" + Number(value || 0).toLocaleString("en-IN", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

    }


    function showMessage(text, type) {

        const message =
            document.getElementById("message");

        message.textContent = text;

        message.className =
            "message " + type;

        message.style.display = "block";

        setTimeout(() => {

            message.style.display = "none";

        }, 3000);

    }


    async function loadOrders() {

        try {

            const response = await fetch(API, {
                headers: {
                    "Authorization": authHeader
                }
            });

            if (!response.ok) {

                throw new Error(
                    "HTTP " + response.status
                );

            }

            orders = await response.json();

            renderOrders();

            updateStats();

        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to load purchase orders.",
                "error"
            );

        }

    }


    function renderOrders() {

        const tbody =
            document.getElementById("orderTableBody");

        tbody.innerHTML = "";


        if (orders.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="9" class="empty">
                        No purchase orders found.
                    </td>
                </tr>
            `;

            return;
        }


        orders.forEach(order => {

            const status =
                order.status || "PENDING";

            const statusClass =
                status.toLowerCase();


            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>${order.id ?? "-"}</td>

                <td>
                    <strong>
                        ${order.poNumber ?? "-"}
                    </strong>
                </td>

                <td>
                    ${order.vendorName ?? "-"}
                </td>

                <td>
                    ${order.productName ?? "-"}
                </td>

                <td>
                    ${order.quantity ?? 0}
                </td>

                <td>
                    ${currency(order.unitPrice)}
                </td>

                <td>
                    <strong>
                        ${currency(order.totalAmount)}
                    </strong>
                </td>

                <td>
                    <span class="status ${statusClass}">
                        ${status}
                    </span>
                </td>

                <td>

                    <button
                        class="action-btn edit"
                        onclick="editOrder(${order.id})">
                        Edit
                    </button>

                    <button
                        class="action-btn delete"
                        onclick="deleteOrder(${order.id})">
                        Delete
                    </button>

                </td>

            `;

            tbody.appendChild(row);

        });

    }


    function updateStats() {

        const total =
            orders.length;

        const pending =
            orders.filter(
                order => order.status === "PENDING"
            ).length;

        const received =
            orders.filter(
                order => order.status === "RECEIVED"
            ).length;

        const totalValue =
            orders.reduce(
                (sum, order) =>
                    sum + Number(order.totalAmount || 0),
                0
            );


        document.getElementById("totalOrders")
            .textContent = total;

        document.getElementById("pendingOrders")
            .textContent = pending;

        document.getElementById("receivedOrders")
            .textContent = received;

        document.getElementById("totalValue")
            .textContent = currency(totalValue);

    }


    document.getElementById("purchaseOrderForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const editId =
                document.getElementById("editId").value;


            const order = {

                poNumber:
                    document.getElementById("poNumber").value,

                vendorName:
                    document.getElementById("vendorName").value,

                productName:
                    document.getElementById("productName").value,

                quantity:
                    Number(
                        document.getElementById("quantity").value
                    ),

                unitPrice:
                    Number(
                        document.getElementById("unitPrice").value
                    ),

                status:
                    document.getElementById("status").value

            };


            try {

                let response;


                if (editId) {

                    response = await fetch(
                        API + "/" + editId,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    authHeader
                            },

                            body: JSON.stringify(order)
                        }
                    );

                } else {

                    response = await fetch(
                        API,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    authHeader
                            },

                            body: JSON.stringify(order)
                        }
                    );

                }


                if (!response.ok) {

                    const text =
                        await response.text();

                    throw new Error(text);

                }


                showMessage(
                    editId
                        ? "Purchase order updated successfully."
                        : "Purchase order created successfully.",
                    "success"
                );


                resetForm();

                await loadOrders();


            } catch (error) {

                console.error(error);

                showMessage(
                    "Unable to save purchase order.",
                    "error"
                );

            }

        });


    function editOrder(id) {

        const order =
            orders.find(
                item => item.id === id
            );


        if (!order) {
            return;
        }


        document.getElementById("editId")
            .value = order.id;

        document.getElementById("poNumber")
            .value = order.poNumber || "";

        document.getElementById("vendorName")
            .value = order.vendorName || "";

        document.getElementById("productName")
            .value = order.productName || "";

        document.getElementById("quantity")
            .value = order.quantity || "";

        document.getElementById("unitPrice")
            .value = order.unitPrice || "";

        document.getElementById("status")
            .value = order.status || "PENDING";


        document.getElementById("formTitle")
            .textContent = "✏️ Edit Purchase Order";

        document.getElementById("saveBtn")
            .textContent = "Update Order";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    async function deleteOrder(id) {

        if (!confirm(
            "Are you sure you want to delete this purchase order?"
        )) {
            return;
        }


        try {

            const response =
                await fetch(
                    API + "/" + id,
                    {
                        method: "DELETE",

                        headers: {
                            "Authorization":
                                authHeader
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Delete failed"
                );

            }


            showMessage(
                "Purchase order deleted successfully.",
                "success"
            );


            await loadOrders();


        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to delete purchase order.",
                "error"
            );

        }

    }


    function resetForm() {

        document.getElementById("purchaseOrderForm")
            .reset();

        document.getElementById("editId")
            .value = "";

        document.getElementById("status")
            .value = "PENDING";

        document.getElementById("formTitle")
            .textContent =
            "➕ Create Purchase Order";

        document.getElementById("saveBtn")
            .textContent =
            "Create Order";

    }


    // Initial load

    loadOrders();

</script>

</body>
</html>
