<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recycling Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: #111827;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #2563eb;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .container {
            padding: 30px;
            max-width: 1200px;
            margin: auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            color: #6b7280;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 28px;
            font-weight: bold;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f3f4f6;
        }

        .pending {
            color: #d97706;
            font-weight: bold;
        }

        .recycled {
            color: #15803d;
            font-weight: bold;
        }

        .low-soh {
            color: #dc2626;
            font-weight: bold;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        .recycle-btn {
            margin: 0;
            padding: 8px 12px;
            background: #16a34a;
        }

        .recycle-btn:hover {
            background: #15803d;
        }

        @media (max-width: 700px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }

            table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="header">

    <h1>♻️ Recycling Management</h1>

    <a href="/" class="back">
        ← Dashboard
    </a>

</div>


<div class="container">

    <!-- Statistics -->

    <div class="stats">

        <div class="stat-card">
            <h3>Total Recycling Records</h3>
            <p id="totalRecords">0</p>
        </div>

        <div class="stat-card">
            <h3>Pending Recycling</h3>
            <p id="pendingRecords">0</p>
        </div>

        <div class="stat-card">
            <h3>Completed Recycling</h3>
            <p id="completedRecords">0</p>
        </div>

    </div>


    <!-- Add Recycling Record -->

    <div class="card">

        <h2>Add Recycling Record</h2>

        <div class="form-grid">

            <input
                    type="text"
                    id="batteryCode"
                    placeholder="Battery Code"
            >

            <input
                    type="number"
                    id="batterySoh"
                    placeholder="Battery SoH (%)"
                    step="0.01"
            >

            <input
                    type="text"
                    id="recyclingSpecialist"
                    placeholder="Recycling Specialist"
            >

            <input
                    type="number"
                    id="recyclingCost"
                    placeholder="Recycling Cost"
                    step="0.01"
            >

            <select id="status">

                <option value="PENDING">
                    Pending
                </option>

                <option value="RECYCLED">
                    Recycled
                </option>

            </select>

            <textarea
                    id="remarks"
                    placeholder="Remarks"
            ></textarea>

        </div>

        <button onclick="createRecycling()">
            Add Recycling Record
        </button>

        <div
                id="message"
                class="message">
        </div>

    </div>


    <!-- Recycling Records -->

    <div class="card">

        <h2>Recycling Records</h2>

        <table>

            <thead>

            <tr>

                <th>ID</th>
                <th>Battery</th>
                <th>SoH</th>
                <th>Specialist</th>
                <th>Cost</th>
                <th>Status</th>
                <th>Date</th>
                <th>Action</th>

            </tr>

            </thead>

            <tbody id="recyclingTable">

            </tbody>

        </table>

    </div>

</div>


<script>

    const username = "admin";

    const password = "admin123";

    const authHeader =
        "Basic " + btoa(username + ":" + password);


    // Create recycling record

    function createRecycling() {

        const recycling = {

            batteryCode:
                document.getElementById("batteryCode").value,

            batterySoh:
                parseFloat(
                    document.getElementById("batterySoh").value
                ),

            recyclingSpecialist:
                document.getElementById("recyclingSpecialist").value,

            recyclingCost:
                parseFloat(
                    document.getElementById("recyclingCost").value
                ),

            status:
                document.getElementById("status").value,

            remarks:
                document.getElementById("remarks").value

        };


        fetch("/api/recycling", {

            method: "POST",

            headers: {

                "Content-Type": "application/json",

                "Authorization": authHeader

            },

            body: JSON.stringify(recycling)

        })

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to create recycling record"
                );

            }

            return response.json();

        })

        .then(data => {

            document.getElementById("message").innerText =
                "✅ Recycling record created successfully!";


            document.getElementById("batteryCode").value = "";

            document.getElementById("batterySoh").value = "";

            document.getElementById("recyclingSpecialist").value = "";

            document.getElementById("recyclingCost").value = "";

            document.getElementById("remarks").value = "";


            loadRecycling();

        })

        .catch(error => {

            document.getElementById("message").innerText =
                "❌ Error creating recycling record";

            console.error(error);

        });

    }


    // Load recycling records

    function loadRecycling() {

        fetch("/api/recycling", {

            method: "GET",

            headers: {

                "Authorization": authHeader

            }

        })

        .then(response => response.json())

        .then(data => {

            const table =
                document.getElementById("recyclingTable");

            table.innerHTML = "";


            let pending = 0;

            let completed = 0;


            data.forEach(record => {

                if (record.status === "PENDING") {

                    pending++;

                }

                if (record.status === "RECYCLED") {

                    completed++;

                }


                const row =
                    document.createElement("tr");


                const statusClass =
                    record.status === "RECYCLED"
                        ? "recycled"
                        : "pending";


                const sohClass =
                    record.batterySoh < 70
                        ? "low-soh"
                        : "";


                row.innerHTML = `

                    <td>${record.id}</td>

                    <td>${record.batteryCode}</td>

                    <td class="${sohClass}">
                        ${record.batterySoh}%
                    </td>

                    <td>
                        ${record.recyclingSpecialist || "-"}
                    </td>

                    <td>
                        ₹ ${record.recyclingCost || 0}
                    </td>

                    <td class="${statusClass}">
                        ${record.status}
                    </td>

                    <td>
                        ${
                            record.recyclingDate
                            ? new Date(
                                record.recyclingDate
                              ).toLocaleDateString()
                            : "-"
                        }
                    </td>

                    <td>

                        ${
                            record.status === "PENDING"
                            ?

                            `<button
                                class="recycle-btn"
                                onclick="markRecycled(${record.id})">
                                Mark Recycled
                            </button>`

                            :

                            "✅ Completed"
                        }

                    </td>

                `;


                table.appendChild(row);

            });


            document.getElementById("totalRecords").innerText =
                data.length;

            document.getElementById("pendingRecords").innerText =
                pending;

            document.getElementById("completedRecords").innerText =
                completed;

        })

        .catch(error =>
            console.error(
                "Error loading recycling records:",
                error
            )
        );

    }


    // Mark as recycled

    function markRecycled(id) {

        fetch(
            `/api/recycling/${id}/status?status=RECYCLED`,
            {
                method: "PUT",

                headers: {
                    "Authorization": authHeader
                }
            }
        )

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to update status"
                );

            }

            return response.json();

        })

        .then(data => {

            loadRecycling();

        })

        .catch(error =>
            console.error(error)
        );

    }


    // Initial load

    loadRecycling();

</script>

</body>
</html>
